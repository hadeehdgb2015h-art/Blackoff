name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blackoff_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blackoff_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U blackoff_test" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://blackoff_test:test@127.0.0.1:5432/blackoff_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Deploy bundle builds (single file, Node 20 target)
        run: npm run bundle
      - name: Deploy scripts are valid shell
        working-directory: .
        run: |
          for f in deploy/*.sh tools/make_release.sh; do bash -n "$f"; done
          shellcheck -S error deploy/*.sh tools/make_release.sh
      - name: Golden contract file is up to date (server ↔ client)
        run: npm run gen:golden && git diff --exit-code -- ../shared/tests
      - name: Load test (16 bots, in-process server, tick budget 2 ms)
        run: npm run loadtest -- --local --bots 16 --seconds 30 --max-tick-ms 2

  client-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Godot version
        run: grep -E "^[A-Z_]+=" tools/godot_version.env >> "$GITHUB_ENV"
      - name: Cache Godot editor and web templates
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-web
      - name: Install Godot
        run: |
          sudo mkdir -p /opt/godot && sudo chown "$USER" /opt/godot
          tools/setup_godot.sh
      - name: Cache stripped engine template
        id: engine
        uses: actions/cache@v4
        with:
          path: build/engine/web_nothreads_release.zip
          key: engine-web-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('tools/engine/**') }}
      - name: Build stripped engine template (cache miss only, about 20 min)
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y icu-devtools >/dev/null
          pipx install scons >/dev/null
          git clone -q --depth 1 --branch "${GODOT_VERSION}-${GODOT_STATUS}" https://github.com/godotengine/godot.git /tmp/godot-src
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install "$EMSDK_VERSION" >/dev/null && /tmp/emsdk/emsdk activate "$EMSDK_VERSION" >/dev/null
          tools/engine/build_web_template.sh /tmp/godot-src /tmp/emsdk build/engine/web_nothreads_release.zip
      - name: Map data in sync with map scene
        env:
          GODOT: /opt/godot/godot
        run: tools/sync_shared.sh && tools/build_maps.sh --check
      - name: Test and export Web build
        env:
          GODOT: /opt/godot/godot
          WEB_TEMPLATE: build/engine/web_nothreads_release.zip
        run: tools/export_web.sh
      - name: Headless game run (bot, 120 s of game time)
        run: |
          BLACKOFF_BOT=1 /opt/godot/godot --headless --path client res://scenes/game/game.tscn \
            --fixed-fps 60 --quit-after 7200 2>&1 | tee /tmp/game.log
          grep -q "\[game\] wave 1 cleared" /tmp/game.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/game.log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser smoke test
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i --no-save playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          export NODE_PATH=/tmp/smoke/node_modules SMOKE_DPR=0.5
          SMOKE_EXPECT="[game] wave 1 started" node tools/smoke_web.cjs build/web build/smoke.png "?autostart=1&bot=1" 45
          SMOKE_TOUCH=1 node tools/smoke_web.cjs build/web build/touch.png "?autostart=1&debug=1" 5
          # an upright phone: the page turns the game to landscape and rewrites the touches
          SMOKE_PORTRAIT=1 SMOKE_TOUCH=1 node tools/smoke_web.cjs build/web build/portrait.png "?autostart=1&debug=1" 5
          SMOKE_CACHE=1 node tools/smoke_web.cjs build/web "" "" 2
      - name: Online end-to-end (real server + Godot bots + web build)
        run: |
          (cd server && npm ci && npm run build)
          (cd server && ALLOW_DEV_AUTH=1 PORT=8799 node dist/index.js > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/healthz >/dev/null && break; sleep 0.5; done
          # two headless Godot clients (bots) play the same zone on the authoritative server
          for i in 1 2; do
            BLACKOFF_SERVER=ws://127.0.0.1:8799/ws BLACKOFF_BOT=1 BLACKOFF_NAME=Bot$i \
              timeout 70 /opt/godot/godot --headless --path client --max-fps 60 res://scenes/game/game.tscn > /tmp/online$i.log 2>&1 &
          done
          wait || true
          cat /tmp/online1.log | grep -E "\[net\]|\[game\]" | head -20
          for i in 1 2; do
            grep -q "\[game\] online: joined" /tmp/online$i.log
            grep -q "\[net\] roster: 2 players" /tmp/online$i.log
            ! grep -E "SCRIPT ERROR|Parse Error" /tmp/online$i.log
          done
          grep -q "\[game\] wave 1 cleared" /tmp/online1.log /tmp/online2.log
          # infection mode: two bots, one turns infected at round start and hunts the other
          for i in 1 2; do
            BLACKOFF_SERVER=ws://127.0.0.1:8799/ws BLACKOFF_BOT=1 BLACKOFF_MODE=infection BLACKOFF_NAME=Inf$i \
              timeout 75 /opt/godot/godot --headless --path client --max-fps 60 res://scenes/game/game.tscn > /tmp/infection$i.log 2>&1 &
          done
          wait || true
          grep -E "\[net\]|\[game\]" /tmp/infection1.log | head -20
          for i in 1 2; do
            grep -q "\[game\] online: joined zone .* (infection)" /tmp/infection$i.log
            grep -q "\[game\] round 1 started" /tmp/infection$i.log
            ! grep -E "SCRIPT ERROR|Parse Error" /tmp/infection$i.log
          done
          grep -qE "\[game\] player [0-9]+ (infected|killed) by|\[game\] round 1 over" /tmp/infection1.log /tmp/infection2.log
          # the web export joins too (WebSocket from the browser)
          export NODE_PATH=/tmp/smoke/node_modules SMOKE_DPR=0.5
          SMOKE_EXPECT="[game] online: joined" node tools/smoke_web.cjs build/web build/online.png "?autostart=1&bot=1&server=ws://127.0.0.1:8799/ws&name=WebBot" 20
          # voice chat on a fresh server (its own zone): the browser talks through a fake
          # microphone, a Node bot talks back; both must hear each other
          (cd server && ALLOW_DEV_AUTH=1 PORT=8798 node dist/index.js > /tmp/server-voice.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8798/healthz >/dev/null && break; sleep 0.5; done
          (cd server && npx tsx tools/voiceBot.ts ws://127.0.0.1:8798/ws Talker 60 --expect-receive > /tmp/voicebot.json 2>&1 &)
          sleep 2
          SMOKE_VOICE=1 node tools/smoke_web.cjs build/web build/voice.png "?autostart=1&voice=1&server=ws://127.0.0.1:8798/ws&name=WebVoice" 12
          for i in $(seq 1 120); do grep -q '"received"' /tmp/voicebot.json && break; sleep 0.5; done
          cat /tmp/voicebot.json
          python3 -c "import json,sys; d=json.loads(open('/tmp/voicebot.json').read().strip().splitlines()[-1]); sys.exit(0 if d['received']>0 and d['decoded']>0 else 1)"
          ! grep -E '"level":"error"' /tmp/server.log /tmp/server-voice.log
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: build/*.png
          if-no-files-found: ignore

  # Builds the deployable release, rehearses the real installer on a clean
  # runner (pm2 + nginx + Postgres, Node 20 like the production server), then
  # publishes it as the "edge" release that installed servers update from.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/hopeful-cerf-elsmwp'
    needs: [server, client-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Bundle server
        run: cd server && npm ci && npm run bundle
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Pack release
        run: tools/make_release.sh build/web build/release "$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy rehearsal (install, play, restart, update, uninstall)
        run: |
          command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq nginx; }
          sudo systemctl start postgresql nginx
          npm i -g pm2@7.0.1 >/dev/null
          # *.localhost counts as a secure context in Chromium, like the real HTTPS site
          echo "127.0.0.1 blackoff.localhost" | sudo tee -a /etc/hosts
          SUDO="sudo env PATH=$PATH"
          # the updater must not swap in the published "edge" build mid-rehearsal: point it at this release
          $SUDO TELEGRAM_BOT_TOKEN=123456:CI-token BLACKOFF_RELEASE_URL="file://$PWD/build/release" bash deploy/install.sh --no-tls --domain blackoff.localhost --release build/release/blackoff.tar.gz --yes
          test "$(cat /opt/blackoff/current/VERSION)" = "$(cat build/release/version.txt)"
          curl -fsS http://blackoff.localhost/healthz | tee /tmp/h.json && echo
          grep -q '"store":"postgres"' /tmp/h.json
          WASM=$(python3 -c "import json;print([f for f in json.load(open('build/web/manifest.json'))['files'] if f.endswith('.wasm')][0])")
          curl -fsSI -H 'Accept-Encoding: gzip' "http://blackoff.localhost/$WASM" | tee /tmp/wasm.h
          grep -qi '^content-encoding: gzip' /tmp/wasm.h && grep -qi '^content-type: application/wasm' /tmp/wasm.h
          grep -qi 'immutable' /tmp/wasm.h
          curl -fsSI http://blackoff.localhost/index.html | grep -qi 'cache-control: no-cache'
          curl -fsS http://blackoff.localhost/config.js | grep -q 'ws://blackoff.localhost/ws'
          cd server
          SMOKE_BOT_TOKEN=123456:CI-token npx tsx tools/smokeDeploy.ts ws://blackoff.localhost/ws 1
          $SUDO pm2 restart blackoff
          for i in $(seq 1 30); do curl -fsS http://blackoff.localhost/healthz >/dev/null 2>&1 && break; sleep 1; done
          SMOKE_BOT_TOKEN=123456:CI-token npx tsx tools/smokeDeploy.ts ws://blackoff.localhost/ws 1 | tee /tmp/s2.json
          grep -q '"gamesBefore":1' /tmp/s2.json   # profile survived the restart (Postgres)
          # the web build as a Telegram Mini App: config.js -> /ws through nginx -> signed login
          INIT=$(npx tsx -e 'import {signInitData} from "./src/net/telegramAuth.ts"; console.log(signInitData({auth_date: String(Math.floor(Date.now()/1000)), user: JSON.stringify({id: 2, first_name: "Mini"})}, "123456:CI-token"))')
          cd ..
          mkdir -p /tmp/smoke && (cd /tmp/smoke && npm init -y >/dev/null && npm i --no-save playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null)
          NODE_PATH=/tmp/smoke/node_modules SMOKE_DPR=0.5 SMOKE_URL=http://blackoff.localhost/ SMOKE_TG_INITDATA="$INIT" \
            SMOKE_EXPECT="[game] online: joined" node tools/smoke_web.cjs build/web build/telegram.png "?autostart=1&online=1&bot=1" 15
          # updater: a newer release is picked up from the release URL
          mkdir -p /tmp/next && tar -xzf build/release/blackoff.tar.gz -C /tmp/next
          echo ci-next > /tmp/next/blackoff/VERSION && tar -C /tmp/next -czf /tmp/next/blackoff.tar.gz blackoff
          (cd /tmp/next && sha256sum blackoff.tar.gz > blackoff.tar.gz.sha256 && echo ci-next > version.txt)
          sudo sed -i 's#^BLACKOFF_RELEASE_URL=.*#BLACKOFF_RELEASE_URL=file:///tmp/next#' /opt/blackoff/.env
          # a player is in a zone (a held smoke client), so a normal check waits...
          (cd server && SMOKE_BOT_TOKEN=123456:CI-token npx tsx tools/smokeDeploy.ts ws://blackoff.localhost/ws 3 90 > /tmp/hold.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://blackoff.localhost/healthz | grep -q '"players":[1-9]' && break; sleep 1; done
          curl -fsS http://blackoff.localhost/healthz | grep -q '"players":[1-9]'
          $SUDO bash /opt/blackoff/bin/update.sh --once
          test "$(cat /opt/blackoff/current/VERSION)" != ci-next
          # ...and --force installs it anyway
          $SUDO bash /opt/blackoff/bin/update.sh --once --force
          test "$(cat /opt/blackoff/current/VERSION)" = ci-next
          curl -fsS http://blackoff.localhost/healthz >/dev/null
          $SUDO bash /opt/blackoff/bin/uninstall.sh --yes --drop-db
          test ! -e /opt/blackoff && test ! -e /etc/nginx/sites-enabled/blackoff
          sudo nginx -t
      - name: Show logs on failure
        if: failure()
        run: sudo tail -n 60 /opt/blackoff/logs/*.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-rehearsal
          path: build/telegram.png
          if-no-files-found: ignore
      - name: Publish release "edge"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edge >/dev/null 2>&1 || gh release create edge --prerelease --target "$GITHUB_SHA" \
            --title "edge (latest build)" --notes "Built automatically. Servers installed with deploy/install.sh update from this release."
          gh release upload edge build/release/blackoff.tar.gz build/release/blackoff.tar.gz.sha256 --clobber
          gh release upload edge build/release/version.txt --clobber   # last: updaters switch only when all files are there
          echo "published $(cat build/release/version.txt)"

  # Phone-testable preview on GitHub Pages (needs a public repo with
  # Settings > Pages > Source = GitHub Actions). Non-blocking until enabled.
  pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: client-web
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live preview
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          sleep 15
          for f in index.html sw.js manifest.json version.txt $(curl -fsS "${URL}manifest.json" | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)['files']))"); do
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 --compressed \
              -w "$f %{http_code} %{content_type} downloaded=%{size_download}B\n" "${URL}$f"
          done
          WASM=$(curl -fsS "${URL}manifest.json" | python3 -c "import json,sys;print([f for f in json.load(sys.stdin)['files'] if f.endswith('.wasm')][0])")
          echo "wasm content-encoding: $(curl -sSI -H 'Accept-Encoding: gzip, br' "${URL}$WASM" | grep -i '^content-encoding' || echo none)"
          curl -fsS "${URL}version.txt"
