name: Fetch sound sources

# The development session cannot reach sound libraries; GitHub's runners can.
# When tools/sfx/fetch_sources.sh changes on a branch, this job downloads the
# CC0 sources it lists into art/sfx_sources/ and commits them to the same
# branch (pushes made with GITHUB_TOKEN do not start other workflows).
on:
  push:
    paths:
      - tools/sfx/fetch_sources.sh

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 sources
        run: bash tools/sfx/fetch_sources.sh art/sfx_sources
      - name: Show what was fetched
        run: |
          cat art/sfx_sources/FETCH_LOG.txt
          du -sh art/sfx_sources
      - name: Commit to this branch
        run: |
          git config user.name "blackoff-ci"
          git config user.email "blackoff-ci@users.noreply.github.com"
          git add art/sfx_sources
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Sound sources (CC0) fetched by CI"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
