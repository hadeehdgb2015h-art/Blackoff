<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; background: #08090a; }
body { color: #e6e6e6; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; overscroll-behavior: none; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif; }
/* The page sizes the canvas itself (resize policy "none"): on a phone held
   upright the canvas is laid out landscape and turned 90 degrees, so the game
   is always played in landscape without any rotation setting (see BlackoffRotate). */
#canvas { display: block; position: fixed; left: 0; top: 0; transform-origin: 0 0; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; background: #08090a; display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 18px; z-index: 2; }
#status .title { font-size: 28px; letter-spacing: 6px; font-weight: 700; color: #c8302a; }
#status-bar { width: min(60vw, 420px); height: 6px; background: #22262a; border-radius: 3px; overflow: hidden; }
#status-fill { width: 0%; height: 100%; background: #c8302a; transition: width .15s; }
#status-text { font-size: 13px; color: #8a9097; min-height: 1em; text-align: center; padding: 0 16px; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>JavaScript is required.</noscript>
<div id="status">
  <div class="title">BLACKOFF</div>
  <div id="status-bar"><div id="status-fill"></div></div>
  <div id="status-text">Loading…</div>
</div>

<script>
// ---- Even frame pacing (phases 30 and 32). The engine's own frame cap on the
// web compares clocks and lands 30 FPS frames at 33 or 50 ms. Instead the page
// hands the engine display refreshes at the cap's pace, by time: a refresh is
// used once at least (1000 / cap - half a refresh) ms passed since the last
// frame given to that loop. So a slow frame is followed by the very next
// refresh (phase 30 counted refreshes, and one slow frame halved the rate).
// The game sets the cap with BlackoffPace.setCap(fps), 0 = every refresh, and
// leaves Engine.max_fps at 0. Installed before the engine script loads.
window.BlackoffPace = (function () {
  const raf = window.requestAnimationFrame.bind(window);
  let cap = 0, interval = 1000 / 60, last = 0;
  // each animation loop (the engine's, the loader's...) is paced on its own
  const lastOf = new WeakMap();
  const delivered = [];  // the last frames given to the engine (tests read the spacing)
  window.requestAnimationFrame = function (cb) {
    return raf(function step(ts) {
      if (last && ts !== last) {
        const d = ts - last;
        if (d > 4 && d < 40) interval += (d - interval) * 0.05;  // the display's refresh interval
      }
      last = ts;
      if (cap > 0) {
        const prev = lastOf.get(cb) || 0;
        if (prev && ts - prev < 1000 / cap - interval * 0.5) { raf(step); return; }
      }
      lastOf.set(cb, ts);
      delivered.push(ts);
      if (delivered.length > 120) delivered.shift();
      cb(ts);
    });
  };
  return {
    setCap: function (fps) { cap = Math.max(0, fps | 0); },
    gaps: function () { return delivered.slice(1).map(function (t, i) { return Math.round(t - delivered[i]); }); },
    // the display's refresh rate and the frame rate the cap gives on it
    info: function () {
      const hz = 1000 / interval;
      return { hz: Math.round(hz), fps: cap > 0 ? Math.round(hz / Math.max(1, Math.ceil(hz / cap - 0.5))) : Math.round(hz) };
    },
  };
})();

// ---- Telegram Mini App bridge (read by res://scripts/core/platform.gd) ----
window.BlackoffTG = (function () {
  function wa() { return (window.Telegram && window.Telegram.WebApp) || null; }
  function atLeast(v) { const w = wa(); return !!(w && w.isVersionAtLeast && w.isVersionAtLeast(v)); }
  return {
    isTelegram: function () { const w = wa(); return !!(w && w.initData); },
    init: function () {
      const w = wa();
      if (!w || !w.initData) return;
      try {
        w.ready();
        w.expand();
        if (atLeast('7.7')) w.disableVerticalSwipes();
        if (atLeast('6.1')) { w.setHeaderColor('#08090a'); w.setBackgroundColor('#08090a'); }
        if (atLeast('6.2')) w.enableClosingConfirmation();
        if (atLeast('6.1') && w.BackButton) w.BackButton.onClick(function () { window.BlackoffTG._backPresses++; });
        if (atLeast('8.0')) { w.requestFullscreen(); }
      } catch (e) { console.warn('Telegram init', e); }
    },
    // Browsers only allow fullscreen inside a user gesture, but Godot handles
    // input a frame later. So requests are queued and applied on the next
    // pointerup (see listener below). Telegram 8.0+ needs no gesture.
    enterFullscreen: function () {
      const w = wa();
      try {
        if (w && w.initData && atLeast('8.0')) {
          if (!w.isFullscreen) w.requestFullscreen();
          if (w.lockOrientation) w.lockOrientation();
          return;
        }
        if (!document.fullscreenElement && !document.webkitFullscreenElement) this._wantFs = true;
      } catch (e) { console.warn('fullscreen', e); }
    },
    _wantFs: false,
    _applyFullscreen: function () {
      if (!this._wantFs) return;
      this._wantFs = false;
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;
      try {
        Promise.resolve(req.call(el)).then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
      } catch (e) {}
    },
    // CSS px the game must keep clear: the phone's cut-outs/bars (safeAreaInset)
    // plus Telegram's own fullscreen buttons (contentSafeAreaInset, Bot API 8.0).
    safeArea: function () {
      const w = wa();
      if (!w || !w.initData) return { top: 0, right: 0, bottom: 0, left: 0 };
      const s = w.safeAreaInset || {}, c = w.contentSafeAreaInset || {};
      const n = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
      const a = { top: n(s.top) + n(c.top), right: n(s.right) + n(c.right), bottom: n(s.bottom) + n(c.bottom), left: n(s.left) + n(c.left) };
      // the turned canvas: the phone's top is the game's left, its right the game's top
      if (window.BlackoffRotate && window.BlackoffRotate.state.rotated) return { top: a.right, right: a.bottom, bottom: a.left, left: a.top };
      return a;
    },
    // the invite carried by a t.me/<bot>?startapp=<param> link (phase 19)
    startParam: function () {
      const w = wa();
      const p = (w && w.initDataUnsafe && w.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('startapp') || '';
      return /^[A-Za-z0-9_-]{1,64}$/.test(p) ? p : '';
    },
    // Telegram's own share sheet (pick a chat); in a browser the system share
    // sheet or the clipboard. Returns what happened, for the game's toast.
    share: function (url, text) {
      const w = wa();
      const tg = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
      try {
        if (w && w.initData && w.openTelegramLink) { w.openTelegramLink(tg); return 'telegram'; }
        if (navigator.share) { navigator.share({ url: url, text: text }).catch(function () {}); return 'system'; }
        if (navigator.clipboard) { navigator.clipboard.writeText(text + ' ' + url).catch(function () {}); return 'copied'; }
      } catch (e) {}
      return 'none';
    },
    // Result card (phase 25). shareMessage sends the message the bot prepared
    // (photo + Play button) to a chat the player picks (Telegram 8.0+).
    shareMessage: function (id) {
      const w = wa();
      try {
        if (w && w.initData && id && atLeast('8.0') && w.shareMessage) { w.shareMessage(id); return 'ok'; }
      } catch (e) {}
      return 'unsupported';
    },
    // the card as a Telegram story (7.8+)
    shareToStory: function (url, text) {
      const w = wa();
      try {
        if (w && w.initData && atLeast('7.8') && w.shareToStory) { w.shareToStory(url, { text: String(text || '').slice(0, 200) }); return 'ok'; }
      } catch (e) {}
      return 'unsupported';
    },
    // save the card to the phone (Telegram 8.0+), else open it in a new tab
    downloadFile: function (url, name) {
      const w = wa();
      try {
        if (w && w.initData && atLeast('8.0') && w.downloadFile) { w.downloadFile({ url: url, file_name: name }); return 'ok'; }
        if (w && w.openLink) { w.openLink(url); return 'opened'; }
        window.open(url, '_blank');
        return 'opened';
      } catch (e) {}
      return 'none';
    },
    // Telegram's back button (phase 27): shown while a panel is open; the
    // phone's back key presses it instead of closing the game. The game reads
    // the presses with takeBack().
    _backPresses: 0,
    setBack: function (on) {
      const w = wa();
      try {
        if (w && w.initData && atLeast('6.1') && w.BackButton) { if (on) w.BackButton.show(); else w.BackButton.hide(); }
      } catch (e) {}
    },
    takeBack: function () { const n = this._backPresses; this._backPresses = 0; return n; },
    canShareCards: function () {
      const w = wa();
      return !!(w && w.initData && atLeast('7.8'));
    },
    haptic: function (kind) {
      const w = wa();
      try { if (w && atLeast('6.1')) w.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {}
    },
  };
})();
</script>
<script>
// ---- Always landscape. A page cannot turn the phone, so when the window is
// portrait (rotation locked, or Telegram's view) the canvas is laid out at
// innerHeight x innerWidth and turned 90 degrees clockwise: the game's top edge
// lies along the phone's right edge, upright once the phone is held sideways.
// Touches are rewritten into the canvas's own coordinates; the engine never
// knows (its resize policy is "none": the page owns the canvas size).
window.BlackoffRotate = (function () {
  const canvas = document.getElementById('canvas');
  const state = { rotated: false, W: 0, H: 0 };
  const realRect = canvas.getBoundingClientRect.bind(canvas);
  function wantRotation() {
    if (new URLSearchParams(location.search).get('norotate') === '1') return false;
    return window.innerHeight > window.innerWidth && matchMedia('(pointer: coarse)').matches;
  }
  function layout() {
    const W = window.innerWidth, H = window.innerHeight, dpr = window.devicePixelRatio || 1;
    const rot = wantRotation();
    state.rotated = rot; state.W = W; state.H = H;
    const cw = rot ? H : W, ch = rot ? W : H;      // the canvas's own (landscape) size in CSS px
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.style.transform = rot ? 'translate(' + W + 'px, 0) rotate(90deg)' : '';
    // Phones have 2-3 device pixels per CSS pixel: rendering a 3D game at the
    // panel's native 2.5-3 megapixels is what makes them hot and slow. The game
    // is designed for 720 lines: never render more than that on a touch screen.
    const touch = matchMedia('(pointer: coarse)').matches;
    const scale = touch ? Math.min(dpr, Math.max(1, 720 / ch)) : dpr;
    const pw = Math.round(cw * scale), ph = Math.round(ch * scale);
    if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
    document.documentElement.classList.toggle('rotated', rot);
  }
  // The engine scales touch positions by canvas.width / rect.width: give it the
  // canvas's own box, not the turned one.
  canvas.getBoundingClientRect = function () {
    if (!state.rotated) return realRect();
    return { x: 0, y: 0, left: 0, top: 0, width: state.H, height: state.W, right: state.H, bottom: state.W };
  };
  // screen point (portrait) -> canvas point: the game's top is on the right edge
  function toCanvas(sx, sy) { return [sy, state.W - sx]; }
  function rewrite(e) {
    if (!state.rotated || e.__blackoffRotated || typeof Touch !== 'function' || typeof TouchEvent !== 'function') return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const conv = function (list) {
      const out = [];
      for (let i = 0; i < list.length; i++) {
        const t = list[i], p = toCanvas(t.clientX, t.clientY);
        out.push(new Touch({ identifier: t.identifier, target: canvas, clientX: p[0], clientY: p[1], pageX: p[0], pageY: p[1],
          screenX: p[0], screenY: p[1], radiusX: t.radiusX, radiusY: t.radiusY, rotationAngle: t.rotationAngle, force: t.force }));
      }
      return out;
    };
    const ev = new TouchEvent(e.type, { touches: conv(e.touches), targetTouches: conv(e.targetTouches), changedTouches: conv(e.changedTouches),
      bubbles: true, cancelable: true, composed: true });
    ev.__blackoffRotated = true;
    canvas.dispatchEvent(ev);
  }
  for (const t of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) window.addEventListener(t, rewrite, { capture: true, passive: false });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 50); });
  layout();
  return { state: state, layout: layout, toCanvas: toCanvas };
})();
// Godot handles the tap a frame later and only then asks for fullscreen; the
// browser still counts the tap as a user gesture for a few seconds, so apply it
// shortly after (same tap), instead of on the next one.
document.addEventListener('pointerup', function () { setTimeout(function () { window.BlackoffTG._applyFullscreen(); }, 150); }, true);
// Godot's web runtime turns every 'pointermove' into a mouse motion, touch
// fingers included, so the move-stick finger would also turn the camera.
// Touch already reaches the game through touch events: drop non-mouse moves.
window.addEventListener('pointermove', function (e) {
  if (e.pointerType && e.pointerType !== 'mouse') e.stopImmediatePropagation();
}, true);
// Phones outside Telegram: go fullscreen on the first tap.
if (matchMedia('(pointer: coarse)').matches) window.BlackoffTG._wantFs = true;
</script>
<script>
// Master limiter (phase 17). The engine connects every sound straight to the
// audio context's speakers; several gunshots, hits and a zombie at once add up
// past full scale and the browser clips them: the crackle heard in fights.
// Each context the page makes now sends `destination` through a fast
// compressor that only acts on peaks.
(function () {
  var Base = window.AudioContext || window.webkitAudioContext;
  if (!Base) return;
  function Limited(opts) {
    var ctx = opts === undefined ? new Base() : new Base(opts);
    try {
      var lim = ctx.createDynamicsCompressor();
      lim.threshold.value = -4;
      lim.knee.value = 4;
      lim.ratio.value = 20;
      lim.attack.value = 0.002;
      lim.release.value = 0.12;
      lim.connect(ctx.destination);
      Object.defineProperty(ctx, 'destination', { value: lim });
    } catch (e) { /* no limiter: plain output */ }
    return ctx;
  }
  Limited.prototype = Base.prototype;
  window.AudioContext = Limited;
  if (window.webkitAudioContext) window.webkitAudioContext = Limited;
})();
</script>
<!-- Optional site config (game server URL), written by deploy/install.sh. -->
<script src="config.js" onerror="void 0"></script>
<!-- Voice chat: microphone capture, codec and playback (tools/hash_web_build.py renames it). -->
<script src="voice.js"></script>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
// Engine and data files carry a content hash in their names (tools/hash_web_build.py
// rewrites GODOT_CONFIG and this id), so phones keep them cached between visits
// and an update downloads only what changed. sw.js keeps a copy as well.
window.BLACKOFF_BUILD = '__BLACKOFF_BUILD__';
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const status = document.getElementById('status');
  const fill = document.getElementById('status-fill');
  const text = document.getElementById('status-text');
  function fail(err) {
    console.error(err);
    text.textContent = (err && err.message) ? err.message : String(err);
    text.style.color = '#e06c64';
  }
  // Load the Telegram SDK without blocking: if telegram.org is slow or blocked
  // the game still starts after a short timeout (Platform then reports no Telegram).
  function loadTelegram() {
    return new Promise(function (resolve) {
      const s = document.createElement('script');
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      s.onload = resolve; s.onerror = resolve;
      setTimeout(resolve, 2500);
      document.head.appendChild(s);
    });
  }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail(new Error('Missing browser features:\n' + missing.join('\n')));
    return;
  }
  const t0 = performance.now();
  loadTelegram().then(function () {
    window.BlackoffTG.init();
    if (window.BlackoffTG.isTelegram()) window.BlackoffTG._wantFs = false;
    return engine.startGame({
      onProgress: function (current, total) {
        if (current > 0 && total > 0) {
          fill.style.width = Math.min(100, (current / total) * 100).toFixed(1) + '%';
          text.textContent = (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
        }
      },
    });
  }).then(function () {
    status.remove();
    // Where the big files came from (console + window.BLACKOFF_LOAD for the smoke test).
    const big = performance.getEntriesByType('resource').filter(function (e) { return /\.(wasm|pck)(\?|$)/.test(e.name); });
    const fromNetwork = big.filter(function (e) { return e.transferSize > 0; }).length;
    window.BLACKOFF_LOAD = { files: big.length, downloaded: fromNetwork, ms: Math.round(performance.now() - t0) };
    console.log('[load] ' + (fromNetwork ? fromNetwork + ' of ' + big.length + ' big files downloaded' : 'all big files from cache') + ' in ' + window.BLACKOFF_LOAD.ms + ' ms');
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('[load] no service worker:', e.message); });
    }
  }, fail);
})();
</script>
</body>
</html>
